name: Publish npm workspace (OIDC)

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Public workspace package name
        required: true
        default: "@zede/vio"
        type: string
      dry_run:
        description: Validate the package without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      GDK_BACKEND: x11
      GSK_RENDERER: cairo
      # The headless runner has no org.a11y.Bus service, so GTK logs a routine
      # "Unable to acquire the address of the accessibility bus" Gtk-WARNING that
      # would fail the warning-free GTK checks. Tests do not exercise a11y.
      GTK_A11Y: none
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config libgtk-4-dev libgirepository1.0-dev gir1.2-gtk-4.0 xvfb dbus-x11 weston
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          run-install: false
      - name: npm with OIDC support
        run: npm install --global npm@11.19.0
      - run: vp install --frozen-lockfile
      - name: Checks, real GTK widgets and packed consumer
        run: dbus-run-session -- xvfb-run -a sh -c 'VIO_TEST_GTK=1 vp env exec --node 24.21.0 vp run check && vp env exec --node 24.21.0 vp run test:gtk'
      - name: Real GTK widgets on Wayland
        env:
          GDK_BACKEND: wayland
        run: |
          dbus-run-session -- sh -c '
            weston --backend=headless-backend.so --socket=vio-wayland --idle-time=0 >weston.log 2>&1 &
            compositor=$!
            trap "kill $compositor" EXIT
            export WAYLAND_DISPLAY=vio-wayland
            for attempt in $(seq 1 50); do
              [ -S "$XDG_RUNTIME_DIR/vio-wayland" ] && break
              sleep 0.1
            done
            VIO_TEST_GTK=1 vp env exec --node 24.21.0 vp run test:gtk
          '
      - name: Publish selected workspace through npm OIDC
        env:
          RELEASE_WORKSPACE: ${{ inputs.workspace }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: vp env exec --node 24.21.0 vp run release
